<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>교과별 AI 수업 실천 과정 — 마무리 인사</title>
<!-- 강의자료 2(교과별 AI 수업 실천 과정) 맨 뒤에 붙는 마무리 인사 슬라이드.
     원본 슬라이드와 같은 틀: 파란 바탕 · 위쪽 흰 머리 막대 · 흰 본문 판 -->
<style>
    @page { size: 1440px 810px; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; color: #252525; word-break: keep-all; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .slide { width: 1440px; height: 810px; position: relative; overflow: hidden; background: #3f53d9; }
    .head { position: absolute; left: 28px; top: 56px; width: 1320px; height: 76px; background: white; border-radius: 8px;
            display: flex; align-items: center; padding-left: 80px; font-size: 34px; font-weight: 500; }
    .panel { position: absolute; left: 28px; top: 178px; width: 1384px; height: 600px; background: white; border-radius: 4px;
             display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px; }
    h1 { font-size: 104px; font-weight: 900; letter-spacing: -0.03em; }
    .lead { font-size: 34px; font-weight: 700; line-height: 1.5; }
    .lead b { color: #3f53d9; }
    .chips { display: flex; gap: 18px; margin-top: 6px; }
    .chips span { font-size: 26px; font-weight: 700; background: #eef1ff; border: 2px solid #c9d1ff; color: #2a3bb5; border-radius: 999px; padding: 10px 26px; }
    .who { position: absolute; right: 60px; bottom: 54px; font-size: 34px; font-weight: 800; }
</style>
</head>
<body>
<section class="slide">
    <div class="head">2026 찾아가는 학교컨설팅(함평손불중 11월 10일)</div>
    <div class="panel">
        <h1>감사합니다!</h1>
        <p class="lead">오늘 만든 자료 <b>하나</b>를 다음 주 수업에서 <b>바로</b> 써 보세요.</p>
        <div class="chips"><span>✨ 생성형 AI</span><span>🎨 Canva</span><span>📝 수업 및 평가 자료</span></div>
    </div>
    <div class="who">조대부중 김효진</div>
</section>
</body>
</html>
